<ellipse cx="1550" cy="340" rx="220" ry="300" fill="#e8a020" opacity=".05" filter="url(#blur3)"/>

<!-- === WALL DECORATIONS === -->
<!-- Shields -->
<g opacity=".55">
  <circle cx="380" cy="200" r="32" fill="#342c20" stroke="#5a4e38" stroke-width="3.5"/>
  <circle cx="380" cy="200" r="22" fill="none" stroke="#5a4e38" stroke-width="2"/>
  <line x1="380" y1="168" x2="380" y2="232" stroke="#5a4e38" stroke-width="2.5"/>
  <line x1="348" y1="200" x2="412" y2="200" stroke="#5a4e38" stroke-width="2.5"/>

  <circle cx="1540" cy="200" r="32" fill="#342c20" stroke="#5a4e38" stroke-width="3.5"/>
  <circle cx="1540" cy="200" r="22" fill="none" stroke="#5a4e38" stroke-width="2"/>
  <line x1="1540" y1="168" x2="1540" y2="232" stroke="#5a4e38" stroke-width="2.5"/>
  <line x1="1508" y1="200" x2="1572" y2="200" stroke="#5a4e38" stroke-width="2.5"/>
</g>

<!-- Crossed axes above throne -->
<g transform="translate(910,138)" opacity=".5">
  <line x1="-38" y1="-48" x2="38" y2="48" stroke="#6a5a40" stroke-width="3.5"/>
  <line x1="38" y1="-48" x2="-38" y2="48" stroke="#6a5a40" stroke-width="3.5"/>
  <path d="M-43,-54 C-58,-64 -58,-44 -43,-52" fill="#6a5a40"/>
  <path d="M43,-54 C58,-64 58,-44 43,-52" fill="#6a5a40"/>
</g>

<!-- Smoke/haze layers -->
