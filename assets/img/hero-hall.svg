  </g>
  <g transform="translate(446,165)">
    <rect x="-5" y="0" width="10" height="38" rx="3" fill="#5a4e38"/>
    <ellipse cx="0" cy="-14" rx="18" ry="28" fill="#e8a020" opacity=".22" filter="url(#blur2)"/>
    <ellipse cx="0" cy="-8" rx="8" ry="16" fill="#f0b030" opacity=".45"/>
    <ellipse cx="0" cy="-4" rx="4" ry="8" fill="#f8c848" opacity=".65"/>
    <ellipse cx="0" cy="-1" rx="2" ry="4" fill="#ffe878" opacity=".8"/>
  </g>
  <g transform="translate(1474,165)">
    <rect x="-5" y="0" width="10" height="38" rx="3" fill="#5a4e38"/>
    <ellipse cx="0" cy="-14" rx="18" ry="28" fill="#e8a020" opacity=".22" filter="url(#blur2)"/>
    <ellipse cx="0" cy="-8" rx="8" ry="16" fill="#f0b030" opacity=".45"/>
    <ellipse cx="0" cy="-4" rx="4" ry="8" fill="#f8c848" opacity=".65"/>
    <ellipse cx="0" cy="-1" rx="2" ry="4" fill="#ffe878" opacity=".8"/>
  </g>
  <g transform="translate(1634,165)">
    <rect x="-5" y="0" width="10" height="38" rx="3" fill="#5a4e38"/>
    <ellipse cx="0" cy="-14" rx="18" ry="28" fill="#e8a020" opacity=".2" filter="url(#blur2)"/>
    <ellipse cx="0" cy="-8" rx="8" ry="16" fill="#f0b030" opacity=".4"/>
    <ellipse cx="0" cy="-4" rx="4" ry="8" fill="#f8c848" opacity=".6"/>
    <ellipse cx="0" cy="-1" rx="2" ry="4" fill="#ffe878" opacity=".75"/>
