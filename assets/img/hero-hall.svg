<!-- Torch glow pools on floor -->
<g filter="url(#blur1)">
  <ellipse cx="286" cy="710" rx="160" ry="60" fill="#e8a020" opacity=".14"/>
  <ellipse cx="446" cy="710" rx="160" ry="60" fill="#e8a020" opacity=".12"/>
  <ellipse cx="1474" cy="710" rx="160" ry="60" fill="#e8a020" opacity=".12"/>
  <ellipse cx="1634" cy="710" rx="160" ry="60" fill="#e8a020" opacity=".1"/>
</g>
<!-- Warm ambient behind pillar pairs -->
