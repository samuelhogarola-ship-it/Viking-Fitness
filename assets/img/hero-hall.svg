<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" preserveAspectRatio="xMidYMid slice">
<defs>
  <radialGradient id="tg" cx="50%" cy="42%" r="65%">
    <stop offset="0%" stop-color="#e8b840" stop-opacity=".5"/>
    <stop offset="30%" stop-color="#c89830" stop-opacity=".25"/>
    <stop offset="100%" stop-color="#1a1510" stop-opacity="0"/>
  </radialGradient>
  <radialGradient id="tL" cx="25%" cy="35%" r="40%">
    <stop offset="0%" stop-color="#f0c050" stop-opacity=".35"/>
    <stop offset="100%" stop-color="#1a1510" stop-opacity="0"/>
  </radialGradient>
  <radialGradient id="tR" cx="75%" cy="35%" r="40%">
    <stop offset="0%" stop-color="#f0c050" stop-opacity=".3"/>
    <stop offset="100%" stop-color="#1a1510" stop-opacity="0"/>
  </radialGradient>
  <linearGradient id="fl" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="#3a3025"/>
    <stop offset="100%" stop-color="#1a1510"/>
  </linearGradient>
  <filter id="blur1"><feGaussianBlur stdDeviation="20"/></filter>
  <filter id="blur2"><feGaussianBlur stdDeviation="10"/></filter>
  <filter id="blur3"><feGaussianBlur stdDeviation="35"/></filter>
  <radialGradient id="vig" cx="50%" cy="50%" r="72%">
    <stop offset="0%" stop-color="#1a1510" stop-opacity="0"/>
    <stop offset="100%" stop-color="#0a0a08" stop-opacity=".5"/>
  </radialGradient>
</defs>

<!-- Base - warm dark brown, not pure black -->
<rect width="1920" height="1080" fill="#1a1610"/>

<!-- Ambient warm glows -->
<rect width="1920" height="1080" fill="url(#tg)"/>
<rect width="1920" height="1080" fill="url(#tL)"/>
<rect width="1920" height="1080" fill="url(#tR)"/>
<ellipse cx="960" cy="380" rx="550" ry="380" fill="#e8b840" opacity=".08" filter="url(#blur3)"/>

<!-- === STONE FLOOR === -->
<rect x="0" y="700" width="1920" height="380" fill="url(#fl)"/>
<g stroke="#4a3e2e" stroke-width="1.2" opacity=".4">
  <line x1="0" y1="740" x2="1920" y2="740"/>
  <line x1="0" y1="810" x2="1920" y2="810"/>
  <line x1="0" y1="900" x2="1920" y2="900"/>
  <line x1="300" y1="700" x2="250" y2="1080"/>
  <line x1="600" y1="700" x2="560" y2="1080"/>
  <line x1="960" y1="700" x2="960" y2="1080"/>
  <line x1="1320" y1="700" x2="1360" y2="1080"/>
  <line x1="1620" y1="700" x2="1670" y2="1080"/>
</g>

<!-- === BACK WALL === -->
<rect x="180" y="60" width="1560" height="640" fill="#252018"/>
<g fill="#2e2820" opacity=".6">
  <rect x="200" y="85" width="370" height="280" rx="3"/>
  <rect x="590" y="85" width="740" height="280" rx="3"/>
  <rect x="1350" y="85" width="370" height="280" rx="3"/>
</g>

<!-- === ROOF BEAMS === -->
<g fill="#4a3e2a" stroke="#5a4e38" stroke-width="1.5">
  <rect x="80" y="28" width="1760" height="22" rx="5"/>
  <rect x="80" y="52" width="1760" height="8" rx="2" fill="#3e3422"/>
  <polygon points="200,52 220,70 230,70 210,52"/>
  <polygon points="450,52 440,70 450,70 460,52"/>
  <polygon points="700,52 680,70 690,70 710,52"/>
  <polygon points="960,52 960,70 975,70 975,52"/>
  <polygon points="1200,52 1220,70 1230,70 1210,52"/>
  <polygon points="1450,52 1470,70 1480,70 1460,52"/>
  <polygon points="1700,52 1680,70 1690,70 1710,52"/>
</g>

<!-- === PILLARS === -->
<g fill="#3e3425">
  <rect x="270" y="65" width="32" height="635" rx="7"/>
  <rect x="430" y="65" width="32" height="635" rx="7"/>
  <rect x="1458" y="65" width="32" height="635" rx="7"/>
  <rect x="1618" y="65" width="32" height="635" rx="7"/>
</g>
<!-- Carved knotwork bands on pillars -->
<g fill="none" stroke="#6a5a3e" stroke-width="1.6" opacity=".65">
  <rect x="274" y="130" width="24" height="34" rx="3"/>
  <rect x="274" y="250" width="24" height="34" rx="3"/>
  <rect x="274" y="380" width="24" height="34" rx="3"/>
  <rect x="434" y="130" width="24" height="34" rx="3"/>
  <rect x="434" y="250" width="24" height="34" rx="3"/>
  <rect x="1462" y="130" width="24" height="34" rx="3"/>
  <rect x="1462" y="250" width="24" height="34" rx="3"/>
  <rect x="1622" y="130" width="24" height="34" rx="3"/>
  <rect x="1622" y="250" width="24" height="34" rx="3"/>
</g>
<!-- Cross beams between pillar pairs -->
<g fill="#4a3e2a">
  <rect x="260" y="108" width="215" height="15" rx="4"/>
  <rect x="1448" y="108" width="215" height="15" rx="4"/>
</g>

<!-- === THRONE === -->
<g transform="translate(910,265)">
  <!-- High back -->
  <rect x="-62" y="-195" width="124" height="215" rx="5" fill="#4a3e2a"/>
  <rect x="-55" y="-185" width="110" height="195" rx="4" fill="#3e3422"/>
  <!-- Pointed top -->
  <polygon points="0,-230 -48,-195 48,-195" fill="#4a3e2a"/>
  <polygon points="0,-240 -30,-210 30,-210" fill="#5a4e38"/>
  <!-- Gold knotwork ornament -->
  <circle cx="0" cy="-125" r="26" fill="none" stroke="#d8b667" stroke-width="2" opacity=".55"/>
  <circle cx="0" cy="-125" r="18" fill="none" stroke="#d8b667" stroke-width="1.3" opacity=".4"/>
  <circle cx="0" cy="-125" r="7" fill="#d8b667" opacity=".2"/>
  <!-- Vertical carved lines on back -->
  <g stroke="#5a4e38" stroke-width="1" opacity=".4">
    <line x1="-30" y1="-90" x2="-30" y2="5"/>
    <line x1="0" y1="-90" x2="0" y2="5"/>
    <line x1="30" y1="-90" x2="30" y2="5"/>
  </g>
  <!-- Seat -->
  <rect x="-58" y="10" width="116" height="44" rx="5" fill="#3e3422"/>
  <!-- Fur draped on seat -->
  <path d="M-64,12 C-64,0 -35,-6 0,-6 C35,-6 64,0 64,12 C64,28 35,34 0,34 C-35,34 -64,28 -64,12Z" fill="#5a4830"/>
  <path d="M-48,10 C-48,2 -26,-2 0,-2 C26,-2 48,2 48,10 C48,22 26,28 0,28 C-26,28 -48,22 -48,10Z" fill="#6a5838"/>
  <!-- Armrests -->
  <rect x="-70" y="-15" width="20" height="72" rx="6" fill="#4a3e2a"/>
  <rect x="50" y="-15" width="20" height="72" rx="6" fill="#4a3e2a"/>
  <!-- Dragon/beast head carvings -->
  <ellipse cx="-60" cy="-20" rx="13" ry="10" fill="#4a3e2a"/>
  <ellipse cx="60" cy="-20" rx="13" ry="10" fill="#4a3e2a"/>
  <circle cx="-63" cy="-23" r="2.5" fill="#d8b667" opacity=".4"/>
  <circle cx="63" cy="-23" r="2.5" fill="#d8b667" opacity=".4"/>
  <!-- Legs -->
  <rect x="-62" y="52" width="15" height="98" rx="4" fill="#3a3020"/>
  <rect x="47" y="52" width="15" height="98" rx="4" fill="#3a3020"/>
  <!-- Platform steps -->
  <rect x="-100" y="145" width="200" height="20" rx="4" fill="#342c20"/>
  <rect x="-120" y="162" width="240" height="20" rx="4" fill="#2e2618"/>
</g>

<!-- === BENCH PRESS (left) === -->
<g transform="translate(500,500)">
  <!-- Timber uprights -->
  <rect x="-58" y="-135" width="14" height="215" rx="4" fill="#4a3e2a"/>
  <rect x="44" y="-135" width="14" height="215" rx="4" fill="#4a3e2a"/>
  <!-- Top brace -->
  <rect x="-62" y="-140" width="124" height="12" rx="3" fill="#5a4e38"/>
  <!-- Iron J-hooks -->
  <rect x="-64" y="-102" width="20" height="9" rx="2" fill="#6a6258"/>
  <rect x="44" y="-102" width="20" height="9" rx="2" fill="#6a6258"/>
  <!-- Iron barbell -->
  <rect x="-110" y="-110" width="220" height="9" rx="4.5" fill="#787068"/>
  <!-- Stone plates LEFT -->
  <ellipse cx="-105" cy="-105" rx="11" ry="24" fill="#5a5650" stroke="#4a4640" stroke-width="2"/>
  <ellipse cx="-120" cy="-105" rx="14" ry="30" fill="#4e4a44" stroke="#3e3a36" stroke-width="2"/>
  <!-- Stone plates RIGHT -->
  <ellipse cx="105" cy="-105" rx="11" ry="24" fill="#5a5650" stroke="#4a4640" stroke-width="2"/>
  <ellipse cx="120" cy="-105" rx="14" ry="30" fill="#4e4a44" stroke="#3e3a36" stroke-width="2"/>
  <!-- Bench frame -->
  <rect x="-45" y="16" width="90" height="18" rx="4" fill="#4a3e2a"/>
  <!-- Bear skin on bench -->
  <path d="M-55,14 C-55,2 -32,-4 0,-4 C32,-4 55,2 55,14 C55,30 32,36 0,36 C-32,36 -55,30 -55,14Z" fill="#5a4830"/>
  <path d="M-42,12 C-42,4 -24,0 0,0 C24,0 42,4 42,12 C42,24 24,28 0,28 C-24,28 -42,24 -42,12Z" fill="#6e5838"/>
  <!-- Fur texture strokes -->
  <g stroke="#8a7048" stroke-width="1" opacity=".6">
    <line x1="-30" y1="8" x2="-26" y2="2"/>
    <line x1="-18" y1="9" x2="-15" y2="3"/>
    <line x1="-6" y1="8" x2="-4" y2="2"/>
    <line x1="6" y1="9" x2="9" y2="3"/>
    <line x1="18" y1="8" x2="21" y2="2"/>
    <line x1="30" y1="9" x2="33" y2="3"/>
  </g>
  <!-- Bear head draped off end -->
  <ellipse cx="-60" cy="18" rx="18" ry="13" fill="#5a4830"/>
  <ellipse cx="-72" cy="14" rx="10" ry="8" fill="#4e3e28"/>
  <circle cx="-75" cy="11" r="2" fill="#d8b667" opacity=".35"/>
  <!-- Legs -->
  <rect x="-40" y="32" width="12" height="48" rx="3" fill="#3e3422"/>
  <rect x="28" y="32" width="12" height="48" rx="3" fill="#3e3422"/>
</g>

<!-- === PULLEY SYSTEM (right) === -->
<g transform="translate(1380,410)">
  <!-- Main frame posts -->
  <rect x="-10" y="-220" width="18" height="350" rx="5" fill="#4a3e2a"/>
  <rect x="-92" y="-220" width="18" height="350" rx="5" fill="#4a3e2a"/>
  <!-- Top beam -->
  <rect x="-96" y="-228" width="112" height="18" rx="5" fill="#5a4e38"/>
  <!-- Pulley wheel -->
  <circle cx="-38" cy="-208" r="16" fill="none" stroke="#787068" stroke-width="4"/>
  <circle cx="-38" cy="-208" r="5" fill="#787068"/>
  <!-- Rope -->
  <g stroke="#8a7c5a" stroke-width="3" fill="none">
    <line x1="-38" y1="-192" x2="-38" y2="45"/>
    <line x1="-38" y1="-192" x2="40" y2="-115"/>
    <line x1="40" y1="-115" x2="40" y2="25"/>
  </g>
  <!-- Hanging stone weights -->
  <rect x="-58" y="45" width="40" height="44" rx="7" fill="#5a5650" stroke="#4a4640" stroke-width="2"/>
  <rect x="-58" y="92" width="40" height="38" rx="7" fill="#4e4a44" stroke="#3e3a36" stroke-width="2"/>
  <!-- Handle -->
  <rect x="28" y="20" width="24" height="12" rx="4" fill="#787068"/>

  <!-- Second cable tower -->
  <g transform="translate(155,5)">
    <rect x="-10" y="-200" width="18" height="325" rx="5" fill="#443a28"/>
    <circle cx="-1" cy="-188" r="14" fill="none" stroke="#787068" stroke-width="3.5"/>
    <circle cx="-1" cy="-188" r="4" fill="#787068"/>
    <line x1="-1" y1="-174" x2="-1" y2="65" stroke="#8a7c5a" stroke-width="3"/>
    <!-- Stone weight stack -->
    <g>
      <rect x="-26" y="65" width="50" height="18" rx="4" fill="#5a5650" stroke="#4a4640" stroke-width="1.5"/>
      <rect x="-26" y="85" width="50" height="18" rx="4" fill="#555248" stroke="#4a4640" stroke-width="1.5"/>
      <rect x="-26" y="105" width="50" height="18" rx="4" fill="#504e44" stroke="#4a4640" stroke-width="1.5"/>
      <rect x="-26" y="125" width="50" height="18" rx="4" fill="#4e4a40" stroke="#3e3a36" stroke-width="1.5"/>
      <rect x="-26" y="145" width="50" height="18" rx="4" fill="#484640" stroke="#3e3a36" stroke-width="1.5"/>
    </g>
    <!-- Gold selection pin -->
    <rect x="26" y="105" width="16" height="6" rx="2" fill="#d8b667" opacity=".7"/>
  </g>
</g>

<!-- === TORCHES ON PILLARS === -->
<g>
  <g transform="translate(286,165)">
    <rect x="-5" y="0" width="10" height="38" rx="3" fill="#5a4e38"/>
    <ellipse cx="0" cy="-14" rx="18" ry="28" fill="#e8a020" opacity=".25" filter="url(#blur2)"/>
    <ellipse cx="0" cy="-8" rx="8" ry="16" fill="#f0b030" opacity=".5"/>
