<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200" role="img" aria-label="Viking Fitness">
  <defs>
    <linearGradient id="vfSteel" x1="0" y1="0" x2="0.2" y2="1">
      <stop offset="0" stop-color="#f4f7fa"/>
      <stop offset="0.38" stop-color="#b9c3cc"/>
      <stop offset="0.62" stop-color="#6f7880"/>
      <stop offset="1" stop-color="#d3dbe2"/>
    </linearGradient>
    <linearGradient id="vfGold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f0d888"/>
      <stop offset="0.5" stop-color="#c9a227"/>
      <stop offset="1" stop-color="#8c6d3f"/>
    </linearGradient>
    <linearGradient id="vfWood" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#4a3120"/>
      <stop offset="0.45" stop-color="#a9793f"/>
      <stop offset="1" stop-color="#3d2818"/>
    </linearGradient>

    <!-- Hacha barbuda: mango vertical, filo hacia la derecha -->
    <g id="vfAxe">
      <!-- mango -->
      <rect x="95" y="24" width="10" height="150" rx="5" fill="url(#vfWood)" stroke="#241708" stroke-width="2.5"/>
      <!-- correa de cuero -->
      <rect x="92" y="152" width="16" height="7" rx="3" fill="#2a1c10"/>
      <rect x="92" y="164" width="16" height="7" rx="3" fill="#2a1c10"/>
      <!-- hoja barbuda -->
      <path d="M104 26
               C132 24 158 36 168 58
               C160 74 150 86 132 92
               C120 84 112 78 104 76 Z"
            fill="url(#vfSteel)" stroke="#222930" stroke-width="4" stroke-linejoin="round"/>
      <!-- bisel del filo -->
      <path d="M148 34 C158 42 164 50 168 58 C160 74 150 86 132 92"
            fill="none" stroke="#f4f7fa" stroke-width="3" opacity=".55" stroke-linecap="round"/>
      <!-- ojo del hacha -->
      <rect x="89" y="20" width="22" height="62" rx="7" fill="#39424a" stroke="#222930" stroke-width="4"/>
      <path d="M100 30 v42" stroke="#c9a227" stroke-width="2.2" opacity=".55" stroke-linecap="round"/>
    </g>
  </defs>

  <!-- Hachas cruzadas: filos hacia fuera -->
  <g transform="translate(100 118) scale(.9) translate(-100 -118)">
    <g transform="rotate(-40 100 118)">
      <use href="#vfAxe" transform="translate(200,0) scale(-1,1)"/>
    </g>
    <use href="#vfAxe" transform="rotate(40 100 118)"/>
  </g>

  <!-- Barra de pesas en el suelo -->
  <g>
    <rect x="24" y="160" width="152" height="8" rx="4" fill="url(#vfSteel)" stroke="#222930" stroke-width="2.5"/>
    <rect x="60" y="146" width="13" height="36" rx="3" fill="url(#vfGold)" stroke="#222930" stroke-width="2.5"/>
    <rect x="127" y="146" width="13" height="36" rx="3" fill="url(#vfGold)" stroke="#222930" stroke-width="2.5"/>
    <rect x="42" y="140" width="16" height="48" rx="4" fill="#39424a" stroke="#222930" stroke-width="2.5"/>
    <rect x="142" y="140" width="16" height="48" rx="4" fill="#39424a" stroke="#222930" stroke-width="2.5"/>
    <path d="M12 194 H188" stroke="#8c6d3f" stroke-width="3.5" stroke-linecap="round" opacity=".75"/>
  </g>
</svg>
